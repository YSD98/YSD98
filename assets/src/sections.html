<!doctype html>
<!--
  Template for every README section image. render.js injects data + icons,
  then screenshots each section with ?c=<section>&theme=light|dark.
  Artwork (hero, character, thumbnails, footer) is cropped from reference.png.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #111111; --text: #222226; --muted: #63636b; --rule: #cfcfd4;
    --card: #fafafa; --card-border: #e1e1e5; --pill: #e4e4e7;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
    --h0: #e6e6e9; --h1: #c7c7cc; --h2: #9b9ba2; --h3: #5d5d64; --h4: #141416;
    --d0: #111111; --d1: #4a4a50; --d2: #85858c; --d3: #b9b9bf;
    --hex: #1c1c1f; --hex-rim: #6b6b72; --hex-ink: #ffffff;
  }
  [data-theme="dark"] {
    --ink: #f0f3f6; --text: #d1d7e0; --muted: #8b949e; --rule: #30363d;
    --card: #151b23; --card-border: #2f363f; --pill: #262c36;
    --shadow: none;
    --h0: #212830; --h1: #3d444d; --h2: #6e7681; --h3: #adb5bf; --h4: #f0f3f6;
    --d0: #f0f3f6; --d1: #aab3bd; --d2: #6e7681; --d3: #3d444d;
    --hex: #0d1117; --hex-rim: #8b949e; --hex-ink: #f0f3f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  b { color: var(--ink); font-weight: 600; }
  .ico { width: 1em; height: 1em; display: inline-block; flex: none; color: var(--ink); }
  .ico svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  .ico svg * { fill: currentColor !important; }

  /* Crops of the reference artwork */
  .crop { position: relative; overflow: hidden; }
  .crop img { position: absolute; max-width: none; }

  /* Section heading: icon, title, hairline */
  .head { display: flex; align-items: center; gap: 18px; height: 56px; }
  .head .ico { font-size: 30px; }
  .head h2 { margin: 0; font-size: 27px; font-weight: 700; color: var(--ink); letter-spacing: -.2px; white-space: nowrap; }
  .head .line { flex: 1; height: 1px; background: var(--rule); margin-left: 6px; }

  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 10px; box-shadow: var(--shadow);
  }
  .pill {
    background: var(--pill); color: var(--ink); border-radius: 999px;
    padding: 9px 20px; font-size: 14px; font-weight: 600; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>/*INJECT*/</script>
<script>
  const q = new URLSearchParams(location.search);
  const C = q.get("c");
  document.documentElement.dataset.theme = q.get("theme") || "light";
  const { DATA, ICONS } = window;
  const REF = "reference.png", REF_W = 1024;

  const ico = (name, size) =>
    `<span class="ico" style="${size ? `font-size:${size}px` : ""}">${ICONS[name]}</span>`;

  // Cover-fit a rectangle (x, y, w, h) of an image into a W x H box.
  function crop(src, imgW, x, y, w, h, W, H, extra = "") {
    const s = Math.max(W / w, H / h);
    const ox = -(x * s) - (w * s - W) / 2, oy = -(y * s) - (h * s - H) / 2;
    return `<div class="crop" style="width:${W}px;height:${H}px;${extra}">
      <img src="${src}" style="width:${imgW * s}px;left:${ox}px;top:${oy}px"></div>`;
  }
  const ref = (x, y, w, h, W, H, extra) => crop(REF, REF_W, x, y, w, h, W, H, extra);

  const head = (icon, title, right = "") =>
    `<div class="head">${ico(icon)}<h2>${title}</h2><div class="line"></div>${right}</div>`;

  const S = {};

  S.hero = () => ref(19, 15, 988, 349, 1000, 353, "border-radius:16px");

  S.about = () => `
    <div style="position:relative;width:1000px;height:190px">
      <div style="width:770px">${head("person", "About Me")}</div>
      <div style="display:flex;margin-top:22px;width:780px">
        <div style="width:395px;font-size:16px;line-height:1.75;padding-right:26px">
          I'm <b>Yash</b> — a passionate <b>game developer</b> from India, focused on creating
          engaging and immersive experiences using <b>Unity and Unreal Engine.</b>
        </div>
        <div style="width:1px;background:var(--rule);margin:4px 0"></div>
        <div style="padding-left:28px;font-size:14.5px;line-height:1;display:grid;gap:15px;align-content:start;padding-top:6px">
          <div style="display:flex;gap:14px;align-items:center">${ico("gamepad", 20)}<span>Currently working with <b>Unity3D</b> and <b>Unreal</b></span></div>
          <div style="display:flex;gap:14px;align-items:center">${ico("sprout", 20)}<span>Exploring game development &amp; interactive media</span></div>
          <div style="display:flex;gap:14px;align-items:center">${ico("bolt", 20)}<b>Fun fact: I love playing games!</b></div>
        </div>
      </div>
      ${ref(792, 370, 210, 172, 220, 180,
        "position:absolute;right:0;top:4px;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)")}
    </div>`;

  S.projects = () => `<div style="width:1000px;padding-top:2px">
    ${head("cube", "Featured Projects", `<span class="pill" style="margin-left:14px">Explore More →</span>`)}</div>`;

  const PROJECTS = [
    { title: "Chompu's Adventure", sub: "A pixel-art platform adventure",
      img: () => crop("thumb-chompu.png", 960, 0, 0, 960, 575, 238, 156, "filter:grayscale(1) contrast(1.05)") },
    { title: "Box Shooter", sub: "An action shooting game", img: () => ref(285, 623, 218, 147, 238, 156) },
    { title: "Cinco Amigos", sub: "A fun group adventure", img: () => ref(522, 623, 218, 147, 238, 156) },
    { title: "Virtual Tour", sub: "Explore college department", img: () => ref(759, 623, 223, 147, 238, 156) },
  ];
  PROJECTS.forEach((p, i) => S[`project-${i + 1}`] = () => `
    <div style="padding:6px">
      <div class="card" style="width:238px;overflow:hidden">
        <div style="border-bottom:1px solid var(--card-border)">${p.img()}</div>
        <div style="display:flex;align-items:center;padding:13px 14px 14px 16px">
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap">
              <span style="font-size:11px;margin-right:7px">▶</span>${p.title}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap">${p.sub}</div>
          </div>
          <div style="font-size:17px;color:var(--ink)">→</div>
        </div>
      </div>
    </div>`);

  S.tech = () => {
    const items = [["unity", "Unity"], ["unreal", "Unreal Engine"], ["blender", "Blender"],
      ["csharp", "C#"], ["cpp", "C++"], ["python", "Python"], ["git", "Git"]];
    const cells = items.map(([k, label], i) => `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;
                  ${i ? "border-left:1px solid var(--rule)" : ""};padding:4px 0">
        ${ico(k, 46)}<div style="font-size:17px;color:var(--ink)">${label}</div></div>`).join("");
    return `<div style="width:1000px">${head("wrench", "Tech Stack")}
      <div style="display:flex;margin-top:18px">${cells}</div></div>`;
  };

  S.stats = () => {
    const fmt = n => n >= 100 ? `${Math.floor(n / 10) * 10}+` : n >= 10 ? `${Math.floor(n / 5) * 5}+` : `${n}+`;
    const nums = [[fmt(DATA.commits), "Total Commits"], [fmt(DATA.repos), "Repositories"], [`${DATA.years}+`, "Years of Learning"]];
    const numCells = nums.map(([n, l], i) => `
      <div style="padding:0 ${i === 2 ? 0 : 20}px 0 ${i ? 20 : 0}px;${i ? "border-left:1px solid var(--rule)" : ""}">
        <div style="font-size:30px;font-weight:700;color:var(--ink);line-height:1.1">${n}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:6px;white-space:nowrap">${l}</div></div>`).join("");
    const days = DATA.contributions;
    const cols = Math.ceil(days.length / 7);
    let cellsHtml = "";
    for (let c = 0; c < cols; c++) for (let r = 0; r < 7; r++) {
      const lv = days[c * 7 + r];
      if (lv === undefined) continue;
      cellsHtml += `<rect x="${c * 16}" y="${r * 16}" width="13" height="13" rx="2.5" fill="var(--h${lv})"/>`;
    }
    const heat = `<svg width="${cols * 16}" height="${7 * 16}">${cellsHtml}</svg>`;

    // Donut
    const R = 38, CIRC = 2 * Math.PI * R;
    let off = 0, arcs = "";
    DATA.languages.forEach((l, i) => {
      const len = (l.pct / 100) * CIRC;
      arcs += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--d${i})" stroke-width="20"
        stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
      off += len;
    });
    const legend = DATA.languages.map((l, i) => `
      <div style="display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink)">
        <span style="width:10px;height:10px;border-radius:50%;background:var(--d${i})"></span>
        <span style="flex:1">${l.name}</span><span>${l.pct.toFixed(1)}%</span></div>`).join("");

    return `<div style="display:flex;gap:18px;width:1000px;padding:4px 0">
      <div class="card" style="width:668px;height:172px;padding:20px 24px;display:flex">
        <div style="width:310px">
          <div style="display:flex;align-items:center;gap:14px">${ico("bars", 24)}
            <span style="font-size:20px;font-weight:700;color:var(--ink)">GitHub Stats</span></div>
          <div style="display:flex;margin-top:30px">${numCells}</div>
        </div>
        <div style="width:1px;background:var(--rule);margin:2px 26px"></div>
        <div style="padding-top:6px">${heat}
          <div style="font-size:12.5px;color:var(--muted);margin-top:8px">Contribution Activity</div></div>
      </div>
      <div class="card" style="flex:1;height:172px;padding:20px 22px">
        <div style="display:flex;align-items:center;gap:12px">${ico("pie", 24)}
          <span style="font-size:20px;font-weight:700;color:var(--ink)">Top Languages</span></div>
        <div style="display:flex;align-items:center;gap:20px;margin-top:8px">
          <svg width="104" height="104" viewBox="0 0 120 120">${arcs}</svg>
          <div style="flex:1;display:grid;gap:9px">${legend}</div></div>
      </div></div>`;
  };

  S.certs = () => `<div style="width:1000px">${head("award", "Certifications")}</div>`;

  const hex = () => {
    const pts = r => [0, 1, 2, 3, 4, 5].map(i => {
      const a = Math.PI / 6 + i * Math.PI / 3;
      return `${32 + r * Math.cos(a)},${32 + r * Math.sin(a)}`;
    }).join(" ");
    return `<svg width="64" height="64" viewBox="0 0 64 64">
      <polygon points="${pts(31)}" fill="var(--hex)" stroke="var(--hex-rim)" stroke-width="2"/>
      <polygon points="${pts(24)}" fill="none" stroke="var(--hex-rim)" stroke-width="1.2" opacity=".7"/>
      <g transform="translate(20 20)" style="color:var(--hex-ink)"><foreignObject width="24" height="24">${ICONS.unity.replace("<svg", '<svg width="24" height="24" fill="currentColor"')}</foreignObject></g>
    </svg>`;
  };
  [["Unity", "Essentials"], ["Unity", "Junior Programmer"]].forEach(([a, b], i) => S[`cert-${i + 1}`] = () => `
    <div style="padding:6px">
      <div class="card" style="width:238px;height:92px;display:flex;align-items:center;gap:16px;padding:0 18px">
        ${hex()}<div style="font-size:15px;line-height:1.35;color:var(--ink)"><b>${a}</b><br>${b}</div>
      </div></div>`);

  // Footer photo, cut into slices so the LinkedIn / Instagram icons can be separate links.
  const FOOT = { W: 1000, H: 152 };
  S.footer = () => ref(21, 1349, 982, 149, FOOT.W, FOOT.H, "border-radius:14px");

  document.getElementById("root").innerHTML = S[C]();
  const x0 = +(q.get("x") || 0);
  if (x0) document.getElementById("root").style.transform = `translateX(${-x0}px)`;
</script>
</body>
</html>
